<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://api.trello.com; img-src data:; base-uri 'none'; form-action 'none'">
<title>Prompts · Carteira Hidráulica</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2331752f'/%3E%3Ctext x='16' y='21' font-family='Segoe UI,Arial' font-size='14' font-weight='700' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=2">
<script src="tema.js?v=1"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="plan-row">
      <div class="tile" aria-hidden="true">CH</div>
      <div class="plan-name">
        <h1>Prompts</h1>
        <p><span class="sync off" id="sync"><i></i><span id="syncTxt">Conectando…</span></span></p>
      </div>
      <div class="spacer"></div>
      <label class="search" title="Atalho: /">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Buscar por número ou título…" autocomplete="off" aria-label="Buscar prompt">
      </label>
      <button class="btn primary" type="button" data-act="new" title="Novo prompt (N)">
        <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>Novo prompt</button>
      <button class="btn" type="button" data-act="refresh" title="Atualizar agora (R)">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Atualizar</button>
      <button class="btn icon ghost" type="button" data-act="theme" title="Tema claro/escuro" aria-label="Alternar tema">
        <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg></button>
    </div>
    <div class="tabs-row">
      <nav class="tabs" aria-label="Visões">
        <a class="tab" href="../" data-view="quadro">Quadro</a>
        <a class="tab" href="../" data-view="resumo">Resumo</a>
        <a class="tab" href="../" data-view="grade">Grade</a>
        <a class="tab" href="../" data-view="lembretes">Lembretes</a>
        <a class="tab" href="./" aria-current="page">Prompts</a>
      </nav>
    </div>
  </header>
  <main class="layout" id="layout">
    <aside class="side" id="side" aria-label="Lista de prompts"></aside>
    <section class="pane" id="pane"></section>
  </main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="app.js?v=4"></script>
</body>
</html>
